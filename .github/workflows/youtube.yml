# Updates the Film section from the Tim Amarok YouTube channel (public feed) every 6 hours.
# Approved by the site owner. Turn it off any time: Actions > "Sync YouTube" > ... > Disable workflow.
name: Sync YouTube
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/youtube.yml", ".github/scripts/youtube.py"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/youtube.py
      - name: Save
        run: |
          git config user.name "youtube-sync"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/youtube.json ] || exit 0
          git add data/youtube.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync YouTube videos"
          git pull --rebase origin main && git push
